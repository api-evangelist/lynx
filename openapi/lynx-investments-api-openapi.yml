        activity_type:
          type: string
        activity_sub_type:
          type: string
        transaction_time:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        date:
          type: string
        type:
          type: string
        currency:
          type: string
        net_amount:
          type: number
        description:
          type: string
        price:
          type: number
        per_share_amount:
          type: number
        qty:
          type: number
        side:
          type: string
        symbol:
          type: string
        cusip:
          type: string
        group_id:
          type: string
        leaves_qty:
          type: number
        order_id:
          type: string
          format: uuid
        order_number:
          type: string
        cum_qty:
          type: number
        order_status:
          type: string
        status:
          type: string
        id:
          type: string
    EquityPosition:
      type: object
      properties:
        symbol:
          type: string
          description: The ticker symbol of the instrument
          example: AMZN
        symbolName:
          type: string
          description: The official name of the company associated to the Instrument
          example: Amazon.com Inc
        assetClass:
          type: string
          description: A group of financial instruments that have similar financial characteristics
          example: Stocks
        subAssetClass:
          type: string
          description: A sub-asset class is a group of assets that share similar characteristics with each other, and also with the broader asset class it is part of
          example: U.S. Stocks
        category:
          type: string
          description: The classification of the sector related to the Instrument
          example: High Yield
        instrumentID:
          type: string
          format: uuid
          description: A unique identifier for a specific instrument
          example: 35d2d5d6-c1f7-4fdc-92f3-2f1c4da02028
        openQty:
          type: number
          description: Quantity of shares owned by the account
