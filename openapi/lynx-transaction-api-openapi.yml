          type: string
          default: Descending
          enum:
          - Ascending
          - Descending
      - name: startDate
        in: query
        description: Start date of date range
        required: false
        schema:
          type: string
        example: '2025-01-01'
      - name: endDate
        in: query
        description: End date of date range
        required: false
        schema:
          type: string
        example: '2025-01-15'
      - name: status
        in: query
        description: Status of the transaction
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - Pending
            - Rejected
            - Settled
            - Returned
      - name: taxYear
        in: query
        description: Tax year to which a contribution or limit applies
        required: false
        schema:
          type: string
        example: '2024'
      - name: referenceId
        in: query
        description: Transaction reference identifier
        required: false
        schema:
          type: string
        example: TRANS00000000004
      - name: page
        in: query
        description: Page number to be returned. If not specified, default is 1.
        required: false
        schema:
          type: integer
          default: 1
        example: 1
      - name: pageSize
        in: query
        description: Maximum number of items to be returned per page. If not specified, default is 25.
        required: false
        schema:
          type: integer
          default: 25
        example: 25
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberContributionRequestSummaryResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
        '401':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
  /transactions/member/list:
    get:
      tags:
      - ''
      summary: Get Member Transactions
      description: Retrieves all transactions that are associated to the member.
      operationId: getMemberTransactions
      parameters:
      - name: clientMemberId
        in: query
        description: Unique client-side identifier for the member
        required: true
        schema:
          type: string
        example: 3f50436491
      - name: clientOrgName
        in: query
        description: The name of the client organization
        required: true
        schema:
          type: string
        example: Health_Plan_ABC_Division
      - name: productName
