openapi: 3.1.0
info:
  title: TRANSACTION API
  description: 'The clientorgcontribute API is used to contribute from a Client Org account to a member account on the Lynx-FH platform. The API initiates the transfer of the contribution amount from the Client Org account to the specific member account. '
  termsOfService: http://lynx-fh.com
  license:
    name: LynxFH
    url: http://lynx-fh.com
  version: '1.0'
servers:
- url: https://sandbox.lynx-fh.co
security:
- bearerAuth: []
paths:
  /transactions/client/ach-pending:
    get:
      tags:
      - ''
      summary: GET Pending ACH Activity
      description: This API will return a list of pending ACH transactions for a specific client org account.
      operationId: getPendingACHActivity
      parameters:
      - name: clientOrgName
        in: query
        description: The name of the client organization
        required: true
        schema:
          type: string
        example: Health_Plan_ABC_Division
      - name: clientOrgAccountId
        in: query
        description: UUID of the client organization's FBO account
        required: true
        schema:
          type: string
        example: 4dbdba69-4875-47c5-a663-04d9aee9ee91
      - name: page
        in: query
        description: Page number to be returned. If not specified, default is 1.
        required: false
        schema:
          type: integer
          default: 1
        example: 1
      - name: pageSize
        in: query
        description: Maximum number of items to be returned per page. If not specified, default is 25.
        required: false
        schema:
          type: integer
          default: 25
        example: 25
      - name: sortValue
        in: query
        description: The property by which the response is sorted
        required: false
        schema:
          type: string
          default: date
          enum:
          - amount
          - date
        example: date
      - name: sortOrder
        in: query
        description: The sort direction
        required: false
        schema:
          type: string
          default: Descending
          enum:
          - Ascending
          - Descending
        example: Descending
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ACHActivityResponseDoc'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
        '401':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
  /transactions/client/authorizations/list:
    get:
      tags:
      - ''
      summary: Get All Member Authorization Summary by Client
      description: Retrieves a list of authorizations in the last seven days for all members in a client.
      operationId: getAllMemberAuthorizationsByClient
      parameters:
      - name: clientOrgName
        in: query
        description: The name of the client organization
        required: true
        schema:
          type: string
        example: Health_Plan_ABC_Division
      - name: sortValue
        in: query
        description: The property by which the response is sorted
        required: false
        schema:
          type: string
          default: authorizationDate
          enum:
          - memberLastName
          - amount
          - authorizationDate
      - name: sortOrder
        in: query
        description: The sort direction
        required: false
        schema:
          type: string
          default: Descending
          enum:
          - Ascending
          - Descending
      - name: status
        in: query
        description: Comma-separated list of transaction statuses
        required: false
        schema:
          type: string
          default: ''
        example: Pending,Approved,Declined,Canceled
      - name: page
        in: query
        description: Page number to be returned. If not specified, default is 1.
        required: false
        schema:
          type: integer
          default: 1
        example: 1
      - name: pageSize
        in: query
        description: Maximum number of items to be returned per page. If not specified, default is 25.
        required: false
        schema:
          type: integer
          default: 25
        example: 25
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllMemberAuthorizationsByClientResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
        '401':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
  /transactions/client/businessaccount/list:
    get:
      tags:
      - ''
      summary: Get All Business Account Transactions
      description: This API will return a list of transactions for all business accounts associated to the client organization or a single business account.
      operationId: getClientOrgTransactions
      parameters:
      - name: clientOrgName
        in: query
        description: The name of the client organization
        required: true
        schema:
          type: string
        example: Health_Plan_ABC_Division
      - name: clientOrgAccountId
        in: query
        description: UUID of the client organization's FBO account
        required: false
        schema:
          type: string
        example: 4dbdba69-4875-47c5-a663-04d9aee9ee91
      - name: accountType
        in: query
        description: Type of account
        required: false
        schema:
          type: string
          default: ''
        example: HSA
      - name: startDate
        in: query
        description: Start date of date range
        required: false
        schema:
          type: string
        example: '2022-03-20'
      - name: endDate
        in: query
        description: End date of date range
        required: false
        schema:
          type: string
        example: '2022-03-25'
      - name: status
        in: query
        description: Status of this transaction
        required: false
        schema:
          type: string
          enum:
          - Pending
          - Clearing
          - Sent
          - Rejected
      - name: type
        in: query
        description: Additional transaction type. Some possible values are listed below; to view the full list refer to the documentation. MemberContribution, ClientOrgContribution, Incentive, Payroll, Cashback, Refund, Reimbursement, MemberPurchase, TransferPointsToDollars, MemberTransfer, Closed, ReceivedAchTransaction, ReceivedWireTransaction.
        required: false
        schema:
          type: string
          enum:
          - ACHPull
          - ACHPush
          - Reimbursement
          - MemberContribution
          - ClientOrgContribution
          - ClaimReimbursement
          - Dispute
          - EcommerceBuy
          - EcommerceRefund
          - EcommerceRevenue
          - EcommerceSalesTax
          - Incentive
          - InvestmentBuy
          - InvestmentFee
          - InvestmentSell
          - Load Authorization
          - Refund
          - Rollover
          - TransferPointsToDollars
          - MemberTransfer
          - MissedFunding
          - Closed
          - ReceivedAchTransaction
          - ReceivedWireTransaction
          - Dividend
          - MonthlyMaintenanceFee
          - MonthlyInvestmentFee
          - Manual
          - Member
          - MemberDebit
          - MemberAccountClosed
          - Reversal
          - Return
          - PreAuth
          - Interest
          - SentAchTransaction
          - THBReferral
          - ThirdPartyServices
          - TRANS Fee Debit
      - name: direction
        in: query
        description: Debit vs. Credit
        required: false
        schema:
          type: string
          enum:
          - Debit
          - Credit
      - name: page
        in: query
        description: Page number to be returned. If not specified, default is 1.
        required: false
        schema:
          type: integer
          default: 1
        example: 1
      - name: pageSize
        in: query
        description: Maximum number of items to be returned per page. If not specified, default is 25.
        required: false
        schema:
          type: integer
          default: 25
        example: 25
      - name: sortValue
        in: query
        description: The property by which the response is sorted
        required: false
        schema:
          type: string
          default: creationDate
          enum:
          - creationDate
          - amount
          - firstName
          - lastName
        example: creationDate
      - name: sortOrder
        in: query
        description: The sort direction
        required: false
        schema:
          type: string
          default: Descending
          enum:
          - Ascending
          - Descending
        example: Descending
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetClientOrgTransactionsResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
        '401':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
  /transactions/client/list:
    get:
      tags:
      - ''
      summary: Get All Member Transactions By Client
      description: Retrieves all member transactions for all members associated with a client.
      operationId: getAllMemberTransactionsByClient
      parameters:
      - name: clientOrgName
        in: query
        description: The name of the client organization
        required: true
        schema:
          type: string
        example: Health_Plan_ABC_Division
      - name: page
        in: query
        description: Page number to be returned. If not specified, default is 1.
        required: false
        schema:
          type: integer
          default: 1
        example: 1
      - name: pageSize
        in: query
        description: Maximum number of items to be returned per page. If not specified, default is 25.
        required: false
        schema:
          type: integer
          default: 25
        example: 25
      - name: sortValue
        in: query
        description: The property by which the response is sorted
        required: false
        schema:
          type: string
          default: creationDate
          enum:
          - firstName
          - lastName
          - creationDate
          - amount
        example: firstName
      - name: sortOrder
        in: query
        description: The sort direction
        required: false
        schema:
          type: string
          default: Descending
          enum:
          - Ascending
          - Descending
        example: Descending
      - name: searchText
        in: query
        description: Search by Member Name or Account Number or Amount or Reference Identifier
        required: false
        schema:
          type: string
          default: ''
        example: lastName or firstName or accountNumber or amount or reference identifier
      - name: startDate
        in: query
        description: Start date of date range
        required: false
        schema:
          type: string
        example: '2022-03-20'
      - name: endDate
        in: query
        description: End date of date range
        required: false
        schema:
          type: string
        example: '2022-03-25'
      - name: status
        in: query
        description: Comma-separated list of transaction statuses
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - Settled
            - Rejected
            - Returned
            - Pending
            - Sent
            - Approved
            - Declined
            - Clearing
            - Canceled
      - name: category
        in: query
        description: 'Describes the transaction category. Possible values are: CONTRIBUTION, DISBURSEMENT, REDEMPTION, TRANSFER, DEPOSIT, WITHDRAWAL, CORPORATE_ACTION, CARD, ADJUSTMENT, RETURN, FEE, and MEMBER_FEE_REVENUE'
        required: false
        schema:
          type: string
          enum:
          - WITHDRAWAL
          - CORPORATE_ACTION
          - CONTRIBUTION
          - REDEMPTION
          - DISBURSEMENT
          - TRANSFER
          - DEPOSIT
          - CARD
          - ADJUSTMENT
          - FEE
          - RETURN
          - FEE_REVENUE
          - MEMBER_FEE_REVENUE
          - REIMBURSEMENT
          - RESERVE_FUNDED
          - DVH_SERVICE
      - name: transactionType
        in: query
        description: Additional transaction type. Some possible values are listed below; to view the full list refer to the documentation. MemberContribution, ClientOrgContribution, Incentive, Payroll, Cashback, Refund, Reimbursement, MemberPurchase, TransferPointsToDollars, MemberTransfer, Closed, ReceivedAchTransaction, ReceivedWireTransaction.
        required: false
        schema:
          type: string
          enum:
          - Closed
          - Refund
          - Payroll
          - Cashback
          - Reimbursement
          - MemberPurchase
          - MemberTransfer
          - MemberContribution
          - ClientOrgContribution
          - TransferPointsToDollars
          - Incentive
          - ReceivedAchTransaction
          - ReceivedWireTransaction
          - InvestmentBuy
          - InvestmentSell
          - MonthlyMaintenanceFee
          - MonthlyInvestmentFee
          - InvestmentFee
          - AtmTransactionFee
          - ATMWithdrawal
          - PrintedStatementFee
          - OverdraftFee
          - AchReturnFee
          - MemberFundTransfer
          - MemberIncentiveContribution
          - MemberIncentiveRedemption
          - Manual
          - Reversal
          - Return
          - PreAuth
          - AccountFund
          - Chargeback
          - Representment
          - Dividend
          - Dispute
          - Interest
          - SentAchTransaction
          - EcommerceBuy
          - ShippingFees
          - MemberAccountClosed
          - ACHDispute
          - MissedFunding
          - ACHRepresentment
          - ThirdPartyServices
          - MemberDebit
          - Rollover
          - FullRollover
          - PartialRollover
          - Forfeiture
          - MemberForfeiture
          - ServiceReferral
          - InsufficientFunds
          - EcommerceRefund
          - MemberOperationsDebit
          - MemberOperationsCredit
          - ClientOperationsDebit
          - ClientOperationsCredit
          - PROVIDER_PAY
          - ADJUSTMENT
          - Return Reversal
          - IndirectRollover
          - RewardFunding
      - name: direction
        in: query
        description: Debit vs. Credit
        required: false
        schema:
          type: string
          enum:
          - Debit
          - Credit
      - name: taxYear
        in: query
        description: Tax year to which a contribution or limit applies
        required: false
        schema:
          type: string
          default: ''
        example: '2024'
      - name: disputeIndicator
        in: query
        description: Indicates whether the transaction has been disputed
        required: false
        schema:
          type: boolean
        example: false
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllMemberTransactionsByClientResponseDoc'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
        '401':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
  /transactions/member/authorizations/detail:
    get:
      tags:
      - ''
      summary: Get Member Authorization Detail
      description: Retrieves detailed information for a member authorization
      operationId: getMemberAuthorizationsDetail
      parameters:
      - name: clientMemberId
        in: query
        description: Unique client-side identifier for the member
        required: true
        schema:
          type: string
        example: 3f50436491
      - name: clientOrgName
        in: query
        description: The name of the client organization
        required: true
        schema:
          type: string
        example: Health_Plan_ABC_Division
      - name: authorizationId
        in: query
        description: Internal unique identifier for the monetary transaction
        required: true
        schema:
          type: string
          format: uuid
        example: 0706cfd4-ea7c-47e5-96ae-ee74abf9f666
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberAuthorizationDetailResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
        '401':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
  /transactions/member/authorizations/list:
    get:
      tags:
      - ''
      summary: Get Member Authorization Summary
      description: 'Retrieves a list of all authorizations for the member identified by the clientMemberId parameter. The retrieved authorization statuses include: ''Settled'', ''Pending'', ''Approve'', ''Declined'' and ''Canceled.'
      operationId: getMemberAuthorizationSummary
      parameters:
      - name: clientMemberId
        in: query
        description: Unique client-side identifier for the member
        required: true
        schema:
          type: string
        example: 3f50436491
      - name: clientOrgName
        in: query
        description: The name of the client organization
        required: true
        schema:
          type: string
        example: Health_Plan_ABC_Division
      - name: productName
        in: query
        description: The name of the product
        required: false
        schema:
          type: string
          default: ''
        example: OTC
      - name: accountName
        in: query
        description: Name of the account
        required: false
        schema:
          type: string
          default: ''
        example: OTC2501
      - name: sortValue
        in: query
        description: The property by which the response is sorted
        required: false
        schema:
          type: string
          default: authorizationDate
          enum:
          - authorizationDate
          - amount
      - name: sortOrder
        in: query
        description: The sort direction
        required: false
        schema:
          type: string
          default: Descending
          enum:
          - Ascending
          - Descending
      - name: startDate
        in: query
        description: Start date of date range
        required: false
        schema:
          type: string
        example: '2025-01-01'
      - name: endDate
        in: query
        description: End date of date range
        required: false
        schema:
          type: string
        example: '2025-01-15'
      - name: status
        in: query
        description: Status of the authorization
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - Settled
            - Pending
            - Approved
            - Declined
            - Canceled
      - name: page
        in: query
        description: Page number to be returned. If not specified, default is 1.
        required: false
        schema:
          type: integer
          default: 1
        example: 1
      - name: pageSize
        in: query
        description: Maximum number of items to be returned per page. If not specified, default is 25.
        required: false
        schema:
          type: integer
          default: 25
        example: 25
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberAuthorizationSummaryResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
        '401':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
  /transactions/member/contribution-limit:
    get:
      tags:
      - ''
      summary: Get Contribution Limit
      description: Retrieves contribution limit of a specific member for the incoming clientMemberId, clientOrgName, productName and taxYear.The contribution limit depends upon a number of factors, including the health coverage type (Individual vs. Family), the tax year, age of the individual (over or under 55). Given a member, this API computes and returns the limit.
      operationId: getMemberContributionLimit
      parameters:
      - name: clientMemberId
        in: query
        description: Unique client-side identifier for the member
        required: true
        schema:
          type: string
        example: 3f50436491
      - name: clientOrgName
        in: query
        description: The name of the client organization
        required: true
        schema:
          type: string
        example: Health_Plan_ABC_Division
      - name: productName
        in: query
        description: The name of the product
        required: true
        schema:
          type: string
        example: HSA_01
      - name: taxYear
        in: query
        description: Tax year to which this contribution or limit applies
        required: true
        schema:
          type: integer
          format: int32
        example: 2021
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetContributionLimitResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
        '401':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
  /transactions/member/contribution-requests/detail:
    get:
      tags:
      - ''
      summary: Get Member Contribution Request Detail
      description: Retrieves detailed information for a member contribution request
      operationId: getMemberContributionDetail
      parameters:
      - name: clientMemberId
        in: query
        description: Unique client-side identifier for the member
        required: true
        schema:
          type: string
        example: 3f50436491
      - name: clientOrgName
        in: query
        description: The name of the client organization
        required: true
        schema:
          type: string
        example: Health_Plan_ABC_Division
      - name: contributionRequestId
        in: query
        description: Internal unique identifier for the monetary transaction
        required: true
        schema:
          type: string
          format: uuid
        example: cf82639c-e3b6-4d51-9871-1e452a2a0001
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberContributionRequestDetailResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
        '401':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
  /transactions/member/contribution-requests/list:
    get:
      tags:
