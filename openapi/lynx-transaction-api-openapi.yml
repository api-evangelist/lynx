          type: string
        example: 3f50436491
      - name: clientOrgName
        in: query
        description: The name of the client organization
        required: true
        schema:
          type: string
        example: Health_Plan_ABC_Division
      - name: productName
        in: query
        description: The name of the product
        required: false
        schema:
          type: string
          default: ''
        example: OTC
      - name: accountName
        in: query
        description: Name of the account
        required: false
        schema:
          type: string
          default: ''
