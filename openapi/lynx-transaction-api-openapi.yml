components:
  schemas:
    ExceptionBaseResponse:
      type: object
      properties:
        data:
          type: object
          description: 'null'
        exceptions:
          type: array
          items:
            $ref: '#/components/schemas/ResponseException'
    ResponseException:
      type: object
      properties:
        errorCode:
          type: string
          description: The GBL error code that is populated when the exceptionSource is SYSTEM
        exceptionSource:
          type: string
          description: Characterizes the type of exception (JSON, SYSTEM, PARAMETER)
        exceptionMessage:
          type: string
          description: Additional information about the exception
    BaseMember:
      type: object
      properties:
        clientMemberId:
          type: string
          description: Unique client-side identifier for the member
          example: 3f50436491
      required:
      - clientMemberId
    ClientOrgDto:
      type: object
      properties:
        name:
          type: string
          description: The name of the client organization
          example: Health_Plan_ABC_Division
      required:
      - name
    GetContributionLimitResponse:
      type: object
      properties:
        clientOrg:
          $ref: '#/components/schemas/ClientOrgDto'
        member:
          $ref: '#/components/schemas/BaseMember'
        productName:
          type: string
        category:
          type: string
        contributionLimit:
          type: string
        contributionTotal:
          type: string
    CounterpartyAccountDto:
      type: object
      properties:
        accountName:
          type: string
          description: A name for this account
          example: John's Bank of America XX-0435
        routingNumber:
          type: string
          description: The account routing number (9 Digits, numeric)
          example: 211070178
        lastFourAccountNumber:
          type: string
          description: The last four digits of the bank account number
          example: 9118
    MemberAccountTransactionsDto:
      type: object
      properties:
        accountName:
          type: string
          description: Name of the account
          example: John's Bank of America XX-0435
        accountType:
          type: string
          description: Type of account
          example: HSA
        productName:
          type: string
          description: The name of the product
          example: HSA_01
        lastFourAccountNumber:
          type: string
          description: The last four digits of the bank account number
          example: 9118
    MemberTransactionDisputeDTO:
      type: object
      properties:
        indicator:
          type: boolean
          description: Indicates whether the transaction has been disputed
        state:
          type: string
          description: State of the dispute in the Claim Queue flow
        status:
          type: string
          description: Additional detail for the dispute state in the Claim process
        reason:
          type: string
          description: Reason of the dispute
    TagDto:
      type: object
      properties:
        name:
          type: string
          description: Constant used to define the metadata within a key-value pair
        value:
          type: string
          description: Variable belonging to the metadata within a key-value pair
        type:
          type: string
          description: Additional client-defined qualifier that may be used to further classify the key-value pair
      required:
      - name
      - value
    TransactionLedgerIdDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the ledger transaction
    GetMemberTransactionsResponseDoc:
      type: object
      properties:
        member:
          $ref: '#/components/schemas/BaseMember'
        clientOrg:
          $ref: '#/components/schemas/ClientOrgDto'
        memberTransactions:
          type: array
          items:
            $ref: '#/components/schemas/MemberTransactionDto'
    MemberTransactionDto:
      type: object
      properties:
        referenceIdentifier:
          type: string
          description: Transaction reference identifier
          example: 4dbdd4694-4875-47d2-b663-04d9aee9ee30
        bankConfirmationId:
          type: string
          description: Confirmation id from bank
          example: 32193678
        category:
          type: string
          description: 'Describes the transaction category. Possible values are: CONTRIBUTION, DISBURSEMENT, REDEMPTION, TRANSFER, DEPOSIT, WITHDRAWAL, CORPORATE_ACTION, CARD, ADJUSTMENT, RETURN, FEE, and MEMBER_FEE_REVENUE'
          example: CONTRIBUTION
        type:
          type: string
          description: Additional transaction type. Some possible values are listed below; to view the full list refer to the documentation. MemberContribution, ClientOrgContribution, Incentive, Payroll, Cashback, Refund, Reimbursement, MemberPurchase, TransferPointsToDollars, MemberTransfer, Closed, ReceivedAchTransaction, ReceivedWireTransaction.
          example: MemberPurchase
        direction:
          type: string
          description: Debit vs. Credit
          example: Debit
        status:
          type: string
          description: Status of this transaction
          example: Settled
        statusReason:
          type: string
          description: The reason for a particular status
          example: HSA rejected due to lack of documentation
        shortMemo:
          type: string
          description: 10 character memo
          example: March19
        longMemo:
          type: string
          description: Long descriptions Max 100 characters
          example: John Smith's monthly contribution
        amount:
          type: number
          description: Dollar transaction amount. Either amount or incentiveValue is required.
          example: 782.34
        serviceDate:
          type: string
          format: date-time
          description: Date of service that triggered this transaction
          example: '2022-03-21'
        counterpartyAccount:
          $ref: '#/components/schemas/CounterpartyAccountDto'
        memberAccount:
          $ref: '#/components/schemas/MemberAccountTransactionsDto'
        merchant:
          $ref: '#/components/schemas/MerchantDTO'
        dispute:
          $ref: '#/components/schemas/MemberTransactionDisputeDTO'
        id:
          type: string
          format: uuid
          description: Internal unique identifier for the monetary transaction
          example: cf82639c-e3b6-4d51-9871-1e452a2a0001
        creationDate:
          type: string
          format: date-time
          description: Date when the record was created
          example: '2018-03-22'
        updateDate:
          type: string
          format: date-time
          description: Date when the record was last updated
          example: '2018-03-22'
        transactionDate:
          type: string
          format: date
          description: Date of service that triggered this transaction
          example: '2018-03-22'
        transactionLedger:
          $ref: '#/components/schemas/TransactionLedgerIdDto'
        incentiveValue:
          type: number
          description: Virtual currency balance of the incentive account based on the incentive ratio
          example: 379
        clientTransactionIdentifier:
          type: string
          description: Unique client-defined identifier for the transaction
          example: 4dbdd4694-4875-47d2-b663-04d9aee9ee30
        correctionIndicator:
          type: boolean
          description: Indicates whether the transaction is a correction
          example: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagDto'
        authorizationDate:
          type: string
          format: date-time
          description: Date and time the transaction occurred
          example: '2018-03-22'
        settlementDate:
          type: string
          format: date-time
          description: Date and time the transaction posted
          example: '2018-03-22'
        bankPaymentId:
          type: string
          description: Unique card processor identifier for the transaction that is human readable
          example: CC0014DA1E02
        transactionTypeDescription:
          type: string
          description: Transaction type description
          example: Purchase Approved NotSettled
        sourceDescription:
          type: string
          description: Description of the source of the transaction
          example: MasterCard debit transactions
        authorizationCode:
          type: string
          description: The system-generated authorization code that is given at the time of purchase
          example: 784026
        authorizationReversalIndicator:
          type: boolean
          description: Indicates whether the authorization has been reversed
          example: false
        cardPresentIndicator:
          type: boolean
          description: Indicates whether the card was present for the transaction
          example: false
        acquirerReferenceNumber:
          type: string
          description: A reference number assigned by the Acquirer maintaining the original source information for a transaction. This number is used to assist in locating/retrieving source information or documents
          example: 5.554650334528689e+22
        spendCategory:
          type: string
          description: IIAS or Filtered Spend Category with the amount
          example: 5A-67.00
        filterType:
          type: string
          description: Type of filter on a transaction with a Spend Category
          example: Item Level
        partnerTransactionId:
          type: string
          format: uuid
          description: Card processor uuid for the transaction
          example: B8242D17-2FF6-4926-A579-4617EB7D77F9
