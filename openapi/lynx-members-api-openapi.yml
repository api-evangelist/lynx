openapi: 3.2.0
info:
  title: MEMBER MANAGEMENT Members API
  description: These API's are used to manage member informations
  termsOfService: http://lynx-fh.com
  license:
    name: LynxFH
    url: http://lynx-fh.com
  version: '"1.0"'
servers:
- url: https://sandbox.lynx-fh.co
security:
- bearerAuth: []
tags:
- name: Members
paths:
  /members/account:
    get:
      tags:
      - Members
      summary: Get Member Account Details
      description: 'Retrieves account details for the member identified by the incoming clientMemberId and clientOrgName. Note that the member could have more than one account; therefore, an array of account objects is returned. Possible account statuses: Account_Active, Closed, Frozen, New.'
      operationId: accountDetails
      parameters:
      - name: clientMemberId
        in: query
        description: Unique client-side identifier for the member
        required: true
        schema:
          type: string
        example: 3f50436491
      - name: clientOrgName
        in: query
        description: The name of the client organization
        required: true
        schema:
          type: string
        example: Health_Plan_ABC_Division
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberAccountResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
        '401':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
  /members/addresses:
    put:
      tags:
      - Members
      summary: Update Member Addresses
      description: Updates addresses for a member (identified by clientMemberId). Attributes that are supplied in the request body are saved for the member.
      operationId: updateMemberAddresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberAddressesRequestDoc'
        required: true
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateMemberResponse'
        '400':
          description: 'Bad request.

            - GBL-105: One address must be designated as primary

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
        '401':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
    delete:
      tags:
      - Members
      summary: Delete Member Address
      description: This API will allow you to delete a member address.
      operationId: deleteMemberAddress
      parameters:
      - name: clientOrgName
        in: query
        description: The name of the client organization
        required: true
        schema:
          type: string
        example: Health_Plan_ABC_Division
      - name: clientMemberId
        in: query
        description: Unique client-side identifier for the member
        required: true
        schema:
          type: string
        example: 3f50436491
      - name: addressId
        in: query
        description: Auto-generated type for the address
        required: true
        schema:
          type: string
        example: Address1
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateMemberResponse'
        '400':
          description: 'Bad request.

            - GBL-114: Cannot delete a primary address

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
        '401':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
  /members/details:
    get:
      tags:
      - Members
      summary: Get Member Details
      description: Retrieves detailed information for the member identified by the incoming clientMemberId and clientOrgName.
      operationId: getMemberDetails
      parameters:
      - name: clientMemberId
        in: query
        description: Unique client-side identifier for the member
        required: true
        schema:
          type: string
        example: 3f50436491
      - name: clientOrgName
        in: query
        description: The name of the client organization
        required: true
        schema:
          type: string
        example: Health_Plan_ABC_Division
      - name: memberPlanBenefitPackageStatus
        in: query
        description: If set to ACTIVE_ONLY, only the current member plan benefit package will be returned; if left null, all member plan benefit packages will be returned
        required: false
        schema:
          type: string
          enum:
          - ACTIVE_ONLY
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberDetailsResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
        '401':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
    patch:
      tags:
      - Members
      summary: Update Member Details
      description: Updates details for a member (identified by clientMemberId). The attributes passed in the request body are saved for the member.
      operationId: updateMemberDetails
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberDetailsRequestDoc'
        required: true
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateMemberResponse'
        '400':
          description: 'Bad request.

            - GBL-140: Field cannot be updated due to KYC completion

            - GBL-144: ClientOrg is not configured to use incentive ratio for the product

            - GBL-152: Consent has already been accepted

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
        '401':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
  /members/emails:
    put:
      tags:
      - Members
      summary: Update Member Emails
      description: Updates the email address(es) for a member (identified by clientMemberId). Attributes that are supplied in the request body are saved for the member.
      operationId: updateMemberEmails
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberEmailsRequestDoc'
        required: true
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateMemberResponse'
        '400':
          description: 'Bad request.

            - GBL-104: One email must be designated as primary

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
        '401':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
    delete:
      tags:
      - Members
      summary: Delete Member Email
      description: This API will allow you to delete a member email address.
      operationId: deleteMemberEmail
      parameters:
      - name: clientOrgName
        in: query
        description: The name of the client organization
        required: true
        schema:
          type: string
        example: Health_Plan_ABC_Division
      - name: clientMemberId
        in: query
        description: Unique client-side identifier for the member
        required: true
        schema:
          type: string
        example: 3f50436491
      - name: emailId
        in: query
        description: Auto-generated type for the email address
        required: true
        schema:
          type: string
        example: Email1
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteMemberResponseDoc'
        '400':
          description: 'Bad request.

            - GBL-116: Cannot delete a primary email address

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
        '401':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
  /members/list:
    get:
      tags:
      - Members
      summary: Get All Member Summary
      description: Retrieves the summary list of members for a given client organization
      operationId: getMemberSummariesByClientOrg
      parameters:
      - name: clientOrgName
        in: query
        description: The name of the client organization
        required: true
        schema:
          type: string
        example: Health_Plan_ABC_Division
      - name: page
        in: query
        description: Page number to be returned. If not specified, default is 1.
        required: false
        schema:
          type: integer
          default: 1
        example: 1
      - name: pageSize
        in: query
        description: Maximum number of items to be returned per page. If not specified, default is 25.
        required: false
        schema:
          type: integer
          default: 25
        example: 25
      - name: sortValue
        in: query
        description: The property by which the response is sorted
        required: false
        schema:
          type: string
          default: creationDate
          enum:
          - firstName
          - lastName
          - creationDate
          - updateDate
      - name: sortOrder
        in: query
        description: The sort direction
        required: false
        schema:
          type: string
          default: Descending
          enum:
          - Ascending
          - Descending
      - name: searchText
        in: query
        description: Search by Member Name or Client Member Id
        required: false
        schema:
          type: string
          default: ''
        example: lastName or firstName or clientMemberId
      - name: status
        in: query
        description: The overall status of the member
        required: false
        schema:
          type: string
          enum:
          - NEW
          - Active
      - name: startDate
        in: query
        description: Start date of date range
        required: false
        schema:
          type: string
        example: '2022-03-20'
      - name: firstName
        in: query
        description: First name
        required: false
        schema:
          type: string
          default: ''
        example: John
      - name: lastName
        in: query
        description: Last name
        required: false
        schema:
          type: string
          default: ''
        example: Smith
      - name: clientMemberId
        in: query
        description: Unique client-side identifier for the member
        required: false
        schema:
          type: string
          default: ''
        example: 3f50436491
      - name: endDate
        in: query
        description: End date of date range
        required: false
        schema:
          type: string
        example: '2022-03-25'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMemberSummariesByClientResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
        '401':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
  /members/phones:
    put:
      tags:
      - Members
      summary: Update Member Phones
      description: Updates the phone numbers for a member (identified by clientMemberId). Attributes that are supplied in the request body are saved for the member.
      operationId: updateMemberPhones
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberPhonesRequestDoc'
        required: true
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateMemberResponse'
        '400':
          description: 'Bad request.

            - GBL-103: One phone number must be designated as primary

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
        '401':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
    delete:
      tags:
      - Members
      summary: Delete Member Phone
      description: This API will allow you to delete a member phone.
      operationId: deleteMemberPhone
      parameters:
      - name: clientOrgName
        in: query
        description: The name of the client organization
        required: true
        schema:
          type: string
        example: Health_Plan_ABC_Division
      - name: clientMemberId
        in: query
        description: Unique client-side identifier for the member
        required: true
        schema:
          type: string
        example: 3f50436491
      - name: phoneId
        in: query
        description: Auto-generated type for the phone number
        required: true
        schema:
          type: string
        example: Phone1
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteMemberResponseDoc'
        '400':
          description: 'Bad request.

            - GBL-115: Cannot delete a primary phone number

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
        '401':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
  /members/status:
    get:
      tags:
      - Members
      summary: Get Member Statuses
      description: Retrieves all statuses that are associated to the member. A member has various statuses; for e.g. Application Status, Account Status, Card Status. This API returns all of these statuses for the incoming clientMemberId and clientOrgName.
      operationId: getStatus
      parameters:
      - name: clientMemberId
        in: query
        description: Unique client-side identifier for the member
        required: true
        schema:
          type: string
        example: 3f50436491
      - name: clientOrgName
        in: query
        description: The name of the client organization
        required: true
        schema:
          type: string
        example: Health_Plan_ABC_Division
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberStatusResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
        '401':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
    delete:
      tags:
      - Members
      summary: Delete Member
      description: This API will allow you to delete a member. This API applies to only those members that are enrolled in the INCENTIVE product.
      operationId: deleteMember
      parameters:
      - name: clientOrgName
        in: query
        description: The name of the client organization
        required: true
        schema:
          type: string
        example: Health_Plan_ABC_Division
      - name: clientMemberId
        in: query
        description: Unique client-side identifier for the member
        required: true
        schema:
          type: string
        example: 3f50436491
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberStatusUpdateResponseDoc'
        '400':
          description: 'Bad request.

            - GBL-117: Member cannot be deleted if not enrolled in the INCENTIVE product

            - GBL-118: Member cannot be deleted if balance is not zero

            - GBL-119: Member cannot be deleted if enrolled in multiple products

            - GBL-174: Member is in Inactive state

            - GBL-604: Member cannot be deleted if they have multiple accounts for the same account type

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
        '401':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
    patch:
      tags:
      - Members
      summary: Update Member Statuses
      description: Updates the status for a member, identified by clientMemberId, in order to activate or deactivate a member.
      operationId: updateMemberStatus
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberStatusRequest'
        required: true
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberStatusUpdateResponseDoc'
        '400':
          description: 'Bad request.

            - GBL-120: Member status is already Inactive

            - GBL-121: Member status is already Active

            - GBL-122: Cannot change status of member from current status

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
        '401':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
  /members/transfer:
    post:
      tags:
      - Members
      summary: Transfer Member
      description: This API will allow you to move a member’s account from one client organization to another, provided the source and destination client organizations are below the same parent client organization.
      operationId: memberTransfer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberTransferRequestDoc'
        required: true
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseMemberResponse'
        '400':
          description: 'Bad request.

            - GBL-106: Unsupported product type for transfer

            - GBL-107: Client org name must be a parent node to both source and destination client orgs

            - GBL-108: Destination client org does not have a parent client org

            - GBL-109: ClientMemberId already exists on the destination client org

            - GBL-110: Product type not found on destination client org

            - GBL-134: ClientOrg is in Inactive state

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
        '401':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
components:
  schemas:
    MemberProductStatusDto:
      type: object
      properties:
        memberApplicationId:
          type: string
          description: Member Application Identifier
          example: Member Application Identifier
        productName:
          type: string
          description: The name of the product
          example: HSA_01
        status:
          type: string
          description: Status of member enrollment for the product
          example: Account_Active
        statusReason:
          type: string
          description: The reason for a particular status
          example: HSA rejected due to lack of documentation
        siteConnectionActive:
          type: boolean
          description: This field indicates if the account is registered AND can actively login to the external website. If not, then this value is false.
          example: false
        memberDocuments:
          type: array
          items:
            $ref: '#/components/schemas/DocumentDto'
        memberAccounts:
          type: array
          items:
            $ref: '#/components/schemas/MemberAccountStatusDto'
      required:
      - productName
      - status
    PhoneDto:
      type: object
      properties:
        type:
          type: string
          description: Auto-generated type for the phone number
          example: Phone1
        typeDescription:
          type: string
          description: Client-defined description for the phone number
          example: Cell
        countryCode:
          type: string
          default: '1'
          description: Phone country code
          example: 1
        phoneNumber:
          type: string
          description: 10-Digit phone number
          example: 5089188736
        phoneExtension:
          type: integer
          format: int32
          description: Optional extension
          example: 344
        primaryIndicator:
          type: boolean
          description: Determines whether this is a primary phone
          example: true
      required:
      - countryCode
      - phoneNumber
    MemberDetailsResponse:
      type: object
      properties:
        clientOrg:
          $ref: '#/components/schemas/ClientOrgDto'
        member:
          $ref: '#/components/schemas/MemberDetailsDto'
    MemberConsentDTO:
      type: object
      properties:
        acceptedIndicator:
          type: boolean
          description: Indicates the member accepted the consent
          enum:
          - 'true'
          example: true
        electronicSignature:
          type: string
          description: The member’s digital signature (full name)
          example: John Smith
        consentDate:
          type: string
          format: date-time
          description: Date the consent was accepted
          example: '2023-08-23'
        consent:
          $ref: '#/components/schemas/ConsentDTO'
    DeleteMemberResponseDoc:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/BaseMember'
        exceptions:
          type: array
          items:
            $ref: '#/components/schemas/ResponseException'
    UpdateMemberDetailsAccountDto:
      type: object
      properties:
        type:
          type: string
          description: HSA
          example: Type of account
        incentiveRatio:
          type: number
          description: The number that is multiplied by the cash deposit value to determine the incentive value
          example: 1.2
      required:
      - incentiveRatio
      - type
    DirectorDTO:
      type: object
      properties:
        companyName:
          type: string
          description: Company Name
          example: IBM
        symbol:
          type: string
          description: Stock Symbol
          example: ACER
    ClientOrgDto:
      type: object
      properties:
        name:
          type: string
          description: The name of the client organization
          example: Health_Plan_ABC_Division
      required:
      - name
    MemberDetailsDto:
      type: object
      properties:
        clientMemberId:
          type: string
          description: Unique client-side identifier for the member
          example: 3f50436491
        healthPlanCoverageType:
          type: string
          description: Type of coverage (Family, Individual)
          example: Family
        namePrefix:
          type: string
          description: Prefix for the name
          example: Doctor
        nameSuffix:
          type: string
          description: Suffix for the name
          example: Jr.
        firstName:
          type: string
          description: First name
          example: John
        middleName:
          type: string
          description: Middle name
          example: Paul
        lastName:
          type: string
          description: Last name
          example: Smith
        race:
          type: string
          description: Member race
          example: Asian
        gender:
          type: string
          description: Member gender
          example: Female
        maritalStatus:
          type: string
          description: Marital status (Married, Never Married, Widowed, etc.)
          example: Never Married
        preferredGenderPronoun:
          type: string
          description: Member preferred gender pronoun
          example: She/Her
        religion:
          type: string
          description: Member religion
          example: Christianity
        ssnLastFour:
          type: string
          description: Last four digits of SSN
          example: 4347
        kycCompletedIndicator:
          type: boolean
          description: Indicates whether Know Your Customer (KYC) has been completed for the member
          example: true
        countryOfCitizenship:
          type: string
          description: Country of citizenship
          example: US
        dateOfBirth:
          type: string
          format: date-time
          description: Date of birth
          example: '1969-03-02'
        status:
          type: string
          description: The overall status of the member
          example: Active
        creationDate:
          type: string
          format: date-time
          description: Date when the member was created
          example: Date when the member was created
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/AddressDto'
        phones:
          type: array
          items:
            $ref: '#/components/schemas/PhoneDto'
        emails:
          type: array
          items:
            $ref: '#/components/schemas/EmailDto'
        language:
          type: string
          description: Language of the member
          example: English
        politicallyExposedNames:
          type: array
          items:
            $ref: '#/components/schemas/PoliticalExposedNameDTO'
        memberProducts:
          type: array
          items:
            $ref: '#/components/schemas/MemberDetailsProductDto'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagDto'
        associatedDirectorships:
          type: array
          items:
            $ref: '#/components/schemas/DirectorDTO'
        memberConsents:
          type: array
          items:
            $ref: '#/components/schemas/MemberConsentDTO'
        memberPlanBenefitPackages:
          type: array
          items:
            $ref: '#/components/schemas/MemberPlanBenefitPackageDto'
        memberProfile:
          $ref: '#/components/schemas/MemberProfileDto'
      required:
      - clientMemberId
    ConsentDTO:
      type: object
      properties:
        name:
          type: string
          description: Name of the consent to be accepted
          enum:
          - INVESTMENT_TERMS_OF_USE
          - INVESTMENT_CUSTOMER_AGREEMENT
          - INVESTMENT_MARKET_DATA_AGREEMENT
          - INVESTMENT_RULE_14B_AGREEMENT
          - INVESTMENT_FINDERS_FEE
          - INVESTMENT_PRIVACY_POLICY
          - INVESTMENT_DATA_SHARING_AGREEMENT
          - INVESTMENT_MARGIN_AGREEMENT
          - PH_TERMS_AND_CONDITIONS
          - PH_ELECTRONIC_CONSENT
          - PH_PRIVACY_POLICY
          - FIS_DIGITAL_WALLET_TERMS
          - FIS_ESIGN_CONSENT
          - FIS_TERMS_AND_CONDITIONS
          - FIS_PRIVACY_POLICY
          - BENACCT_PRIVACY_POLICY
          - BENACCT_TERMS_OF_USE
          example: INVESTMENT_PRIVACY_POLICY
        description:
