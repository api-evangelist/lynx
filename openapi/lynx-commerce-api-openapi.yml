        in: query
        description: The name of the catalog
        required: false
        schema:
          type: string
        example: HSA_Catalog
      - name: classificationName
        in: query
        description: Lynx custom category groupings
        required: false
        schema:
          type: string
        example: Summer Sale
      - name: categories
        in: query
        description: Pipe delimited list of commodity types
        required: false
        style: pipeDelimited
        explode: false
        schema:
          type: array
          items:
            type: string
        example: Gloves|Socks
      - name: brands
        in: query
        description: Brand of commodity
        required: false
        style: pipeDelimited
        explode: false
        schema:
          type: array
          items:
            type: string
        example: Apple
      - name: searchValue
        in: query
        description: Search commodities by description, category, sku or brand
        required: false
        schema:
          type: string
        example: Antimicrobial
      - name: product
        in: query
        description: The name of the product
        required: false
        schema:
          type: string
        example: HSA_01
      - name: categoryThreshold
        in: query
        description: Minimum number of products for a category to appear in the facet
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: brandThreshold
        in: query
        description: Minimum number of products for a brand to appear in the facet
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommerceCatalogFacetsResponse'
        '400':
          description: 'Bad request.

            - GBL-354: Classification name does not exist or is not available

            '
