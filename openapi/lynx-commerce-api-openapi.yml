          example: 038-0447548957
        amount:
          type: number
          description: Amount charged to card
          example: 40.75
        partnerOrgName:
          type: string
          description: The card partner the transaction was captured with, ProHealth or TrustCommerce
          example: TrustCommerce
      required:
      - amount
      - id
      - partnerOrgName
    CalculateSalesTaxResponse:
      type: object
      properties:
        clientOrg:
          $ref: '#/components/schemas/ClientOrgDto'
        member:
          $ref: '#/components/schemas/BaseMember'
        shipToAddress:
          $ref: '#/components/schemas/BaseAddress'
        salesTaxAmount:
          type: number
        memberCart:
          type: array
          items:
            $ref: '#/components/schemas/SalesTaxCartDetailDto'
    ClientOrgDto:
      type: object
      properties:
        name:
          type: string
          description: The name of the client organization
          example: Health_Plan_ABC_Division
      required:
      - name
    CalculateSalesTaxRequestDto:
      type: object
      properties:
        clientOrg:
          $ref: '#/components/schemas/ClientOrgDto'
        member:
          $ref: '#/components/schemas/BaseMember'
        shipToAddress:
          $ref: '#/components/schemas/BaseAddress'
