    get:
      tags:
      - Commerce
      summary: Get Catalog Facets
      description: Returns the category and brand filter facets with counts, scoped to the current classification, search and cross-selection context so each option's count matches the commodity list the grid would return.
      operationId: getCommodityFacets
      parameters:
      - name: clientOrgName
        in: query
        description: The name of the client organization
        required: true
        schema:
          type: string
        example: Health_Plan_ABC_Division
