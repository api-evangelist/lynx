openapi: 3.1.0
info:
  title: COMMERCE ORDER API
  description: These API's are for commerce order management
  termsOfService: http://lynx-fh.com
  license:
    name: LynxFH
    url: http://lynx-fh.com
  version: '"1.0"'
servers:
- url: https://sandbox.lynx-fh.co
security:
- bearerAuth: []
paths:
  /commerce/cart/add:
    post:
      tags:
      - ''
      summary: Add to Cart
      description: This API adds a commodity to a member’s cart.
      operationId: addToCart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartRequest'
        required: true
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          description: 'Bad request.

            - GBL-134: ClientOrg is in Inactive state

            - GBL-222: Client org must be enrolled in ECOMMERCE product to access this API

            - GBL-174: Member is in Inactive state

            - GBL-327: Product is unavailable due to current status

            - GBL-210: SKU is in the client org exclusion list

            - GBL-221: Unable to order, item is not in stock

            - GBL-252: SKU is not eligible for this member or catalog

            - GBL-217: SKU is already in member''s cart

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
        '401':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
  /commerce/cart/detail:
    get:
      tags:
      - ''
      summary: Get Cart Detail
      description: This API returns the details for a specific cart.
      operationId: getCartDetail
      parameters:
      - name: clientOrgName
        in: query
        description: The name of the client organization
        required: true
        schema:
          type: string
        example: Health_Plan_ABC_Division
      - name: clientMemberId
        in: query
        description: Unique client-side identifier for the member
        required: true
        schema:
          type: string
        example: 3f50436491
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCartDetailDocModelResponse'
        '400':
          description: 'Bad request.

            - GBL-134: ClientOrg is in Inactive state

            - GBL-222: Client org must be enrolled in ECOMMERCE product to access this API

            - GBL-174: Member is in Inactive state

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
        '401':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
  /commerce/cart/update:
    put:
      tags:
      - ''
      summary: Update Cart
      description: This API updates a commodity in the member’s cart.
      operationId: updateCart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartRequest'
        required: true
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          description: 'Bad request.

            - GBL-134: ClientOrg is in Inactive state

            - GBL-222: Client org must be enrolled in ECOMMERCE product to access this API

            - GBL-174: Member is in Inactive state

            - GBL-221: Unable to order, item is not in stock

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
        '401':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
  /commerce/coupon:
    delete:
      tags:
      - ''
      summary: Delete coupon
      description: This API removes a promotional coupon code from the member's current cart.
      operationId: deleteCoupon
      parameters:
      - name: clientMemberId
        in: query
        required: true
        schema:
          type: string
      - name: clientOrgName
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCouponResponse'
        '400':
          description: 'Bad request.

            - GBL-134: ClientOrg is in Inactive state

            - GBL-222: Client org must be enrolled in ECOMMERCE product to access this API

            - GBL-174: Member is in Inactive state

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
        '401':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
  /commerce/coupon/validate:
    post:
      tags:
      - ''
      summary: Validate Coupon
      description: This API validates a promotional coupon code against the member's current cart. Returns eligibility status and, if valid, a pricing preview with the calculated discount pre-tax.
      operationId: validateCoupon
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateCouponRequest'
        required: true
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateCouponResponse'
        '400':
          description: 'Bad request.

            - GBL-134: ClientOrg is in Inactive state

            - GBL-222: Client org must be enrolled in ECOMMERCE product to access this API

            - GBL-174: Member is in Inactive state

            - GBL-219: Member''s cart is empty

            - GBL-606: This coupon cannot be applied to your order

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
        '401':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
  /commerce/external-card:
    delete:
      tags:
      - ''
      summary: Delete External Card
      description: This API deletes an external card of a member.
      operationId: deleteExternalCard
      parameters:
      - name: clientOrgName
        in: query
        required: true
        schema:
          type: string
      - name: clientMemberId
        in: query
        required: true
        schema:
          type: string
      - name: partnerId
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteExternalCardDocModelResponse'
        '400':
          description: 'Bad request.

            - GBL-134: ClientOrg is in Inactive state

            - GBL-222: Client org must be enrolled in ECOMMERCE product to access this API

            - GBL-174: Member is in Inactive state

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
        '401':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
  /commerce/external-card/list:
    get:
      tags:
      - ''
      summary: Get External Cards List
      description: This API returns the list of external cards for a specific member.
      operationId: getExternalCardsList
      parameters:
      - name: clientOrgName
        in: query
        required: true
        schema:
          type: string
      - name: clientMemberId
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetExternalCardsListDocModelResponse'
        '400':
          description: 'Bad request.

            - GBL-134: ClientOrg is in Inactive state

            - GBL-222: Client org must be enrolled in ECOMMERCE product to access this API

            - GBL-174: Member is in Inactive state

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
        '401':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
  /commerce/order:
    post:
      tags:
      - ''
      summary: Place Member E-commerce Order
      description: The place member ecommerce order API is used to make an e-commerce order for a member.
      operationId: postMemberEcommerceOrder
      requestBody:
        description: This is the member e-commerce order request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostMemberEcommerceOrderRequestDoc'
        required: true
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberEcommerceOrderResponse'
        '400':
          description: 'Bad request.

            - GBL-134: ClientOrg is in Inactive state

            - GBL-222: Client org must be enrolled in ECOMMERCE product to access this API

            - GBL-174: Member is in Inactive state

            - GBL-173: Member account is not active or is expired

            - GBL-200: Member account has a future dated effective date

            - GBL-133: Insufficient funds in member account

            - GBL-219: Member''s cart is empty

            - GBL-273: Sales tax must be calculated before placing an order

            - GBL-229: Amount requested exceeds the total order amount

            - GBL-220: Total order amount exceeds amount requested

            - GBL-249: SKU is out of stock

            - GBL-327: Product is unavailable due to current status

            - GBL-221: Unable to order, item is not in stock

            - GBL-194: External card ID is not valid

            - GBL-607: Coupon code does not match the coupon applied to the cart

            - GBL-230: There was an issue with your request, please try again

            - GBL-295: Unable to void transaction, nightly settlement has already occurred

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
        '401':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
  /commerce/order/detail:
    get:
      tags:
      - ''
      summary: Get Order Detail
      description: This API returns detailed information for the specific order.
      operationId: getOrderDetail
      parameters:
      - name: clientOrgName
        in: query
        description: The name of the client organization
        required: true
        schema:
          type: string
        example: Health_Plan_ABC_Division
      - name: clientMemberId
        in: query
        description: Unique client-side identifier for the member
        required: true
        schema:
          type: string
        example: 3f50436491
      - name: orderNumber
        in: query
        description: A unique order identifier created when an order is placed
        required: true
        schema:
          type: string
        example: ORD00000000004
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrderDetailDocModelResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
        '401':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
  /commerce/order/list:
    get:
      tags:
      - ''
      summary: Get Orders List
      description: This API returns the list of orders.
      operationId: getOrdersList
      parameters:
      - name: clientOrgName
        in: query
        description: The name of the client organization
        required: true
        schema:
          type: string
        example: Health_Plan_ABC_Division
      - name: clientMemberId
        in: query
        description: Unique client-side identifier for the member
        required: false
        schema:
          type: string
          default: ''
        example: 3f50436491
      - name: orderNumber
        in: query
        description: A unique order identifier created when an order is placed
        required: false
        schema:
          type: string
          default: ''
        example: ORD00000000004
      - name: page
        in: query
        description: Page number to be returned. If not specified, default is 1.
        required: false
        schema:
          type: integer
          default: 1
        example: 1
      - name: pageSize
        in: query
        description: Maximum number of items to be returned per page. If not specified, default is 25.
        required: false
        schema:
          type: integer
          default: 25
        example: 25
      - name: sortValue
        in: query
        description: The property by which the response is sorted
        required: false
        schema:
          type: string
          default: creationDate
          enum:
          - creationDate
      - name: sortOrder
        in: query
        description: The sort direction
        required: false
        schema:
          type: string
          default: Descending
          enum:
          - Ascending
          - Descending
      - name: status
        in: query
        description: The status of the order
        required: false
        schema:
          type: string
          enum:
          - New
          - Processing
          - Cancelled
          - Delivered
          - Returned
      - name: startDate
        in: query
        description: Start date of date range
        required: false
        schema:
          type: string
        example: '2022-03-20'
      - name: endDate
        in: query
        description: End date of date range
        required: false
        schema:
          type: string
        example: '2022-03-25'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrderListDocModelResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
        '401':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
  /commerce/order/purchase-history:
    get:
      tags:
      - ''
      summary: Get Purchase History Commodities
      description: Returns a paginated list of commodities previously purchased by the member, including last purchase date and total quantity purchased.
      operationId: getPurchaseHistory
      parameters:
      - name: clientOrgName
        in: query
        description: The name of the client organization
        required: true
        schema:
          type: string
        example: Health_Plan_ABC_Division
      - name: clientMemberId
        in: query
        description: Unique client-side identifier for the member
        required: false
        schema:
          type: string
          default: ''
        example: 3f50436491
      - name: page
        in: query
        description: Page number to be returned. If not specified, default is 1.
        required: false
        schema:
          type: integer
          default: 1
        example: 1
      - name: pageSize
        in: query
        description: Maximum number of items to be returned per page. If not specified, default is 25.
        required: false
        schema:
          type: integer
          default: 25
        example: 25
      - name: sortBy
        in: query
        description: The property by which the response is sorted
        required: false
        schema:
          type: string
          default: lastPurchasedDate
          enum:
          - lastPurchasedDate
          - totalQuantityPurchased
      - name: sortOrder
        in: query
        description: The sort direction
        required: false
        schema:
          type: string
          default: Descending
          enum:
          - Ascending
          - Descending
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseHistoryDocModelResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
        '401':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
  /commerce/order/replace:
    post:
      tags:
      - ''
      summary: Replace Item E-commerce Order
      description: Allows a client to replace an item that may have been damaged or not delivered.
      operationId: postCommerceReplace
      requestBody:
        description: This is the replace e-commerce order request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostReplaceEcommerceOrderRequest'
        required: true
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceOrderResponseModel'
        '400':
          description: 'Bad request.

            - GBL-134: ClientOrg is in Inactive state

            - GBL-222: Client org must be enrolled in ECOMMERCE product to access this API

            - GBL-174: Member is in Inactive state

            - GBL-232: Unable to request replacement for items ordered over the allowed number of days ago

            - GBL-234: No item found with SKU in the original order

            - GBL-231: Unable to replace items that are not in shipped or delivered status

            - GBL-229: Replacement quantity exceeds the quantity originally ordered

            - GBL-230: There was an issue with your request, please try again

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
        '401':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
  /commerce/order/tax:
    put:
      tags:
      - ''
      summary: Calculate Sales Tax
      description: This API calculates the estimated taxes for a member’s order. Each of the items within the member’s cart will be returned with the sales tax amount required to be collected.
      operationId: calculateSalesTax
      requestBody:
        description: This is the calculate sales tax request body
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutCommerceSalesTaxRequest'
        required: true
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculateSalesTaxResponse'
        '400':
          description: 'Bad request.

            - GBL-134: ClientOrg is in Inactive state

            - GBL-222: Client org must be enrolled in ECOMMERCE product to access this API

            - GBL-174: Member is in Inactive state

            - GBL-219: Member''s cart is empty

            - GBL-230: There was an issue with your request, please try again

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
        '401':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
  /commerce/refund:
    post:
      tags:
      - ''
      summary: Submit E-Commerce Refund
      description: Allows a member to submit a refund request for a recently completed e-commerce order.
      operationId: postRefund
      requestBody:
        description: This is the post refund request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostEcommerceRefundRequest'
        required: true
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberEcommerceOrderResponse'
        '400':
          description: 'Bad request.

            - GBL-134: ClientOrg is in Inactive state

            - GBL-222: Client org must be enrolled in ECOMMERCE product to access this API

            - GBL-174: Member is in Inactive state

            - GBL-232: Unable to request refund for items ordered over the allowed number of days ago

            - GBL-234: No item found with SKU in the order

            - GBL-238: Item has already had a refund requested

            - GBL-231: Unable to request refund for items not in shipped or delivered status

            - GBL-235: Refund quantity exceeds the quantity ordered

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
        '401':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
  /commerce/refund/list:
    get:
      tags:
      - ''
      summary: Get E-Commerce Refund List
      description: Allows a member to retrieve a list of their refund requests, including details such as the order number, item SKU, quantity, refund reason, status, and refund amount.
      operationId: getMemberOrderRefundList
      parameters:
      - name: clientOrgName
        in: query
        description: The name of the client organization
        required: true
        schema:
          type: string
        example: Health_Plan_ABC_Division
      - name: clientMemberId
        in: query
        description: Unique client-side identifier for the member
        required: true
        schema:
          type: string
        example: 3f50436491
      - name: orderNumber
        in: query
        description: A unique order identifier created when an order is placed
        required: false
        schema:
          type: string
          default: ''
        example: ORD00000000004
      - name: page
        in: query
        description: Page number to be returned. If not specified, default is 1.
        required: false
        schema:
          type: integer
          default: 1
        example: 1
      - name: pageSize
        in: query
        description: Maximum number of items to be returned per page. If not specified, default is 25.
        required: false
        schema:
          type: integer
          default: 25
        example: 25
      - name: sortValue
        in: query
        description: The property by which the response is sorted
        required: false
        schema:
          type: string
          default: creationDate
          enum:
          - creationDate
      - name: sortOrder
        in: query
        description: The sort direction
        required: false
        schema:
          type: string
          default: Descending
          enum:
          - Ascending
          - Descending
      - name: status
        in: query
        description: The status of the order
        required: false
        schema:
          type: string
          enum:
          - Pending
          - Refunded
          - RefundDenied
      - name: startDate
        in: query
        description: Start date of date range
        required: false
        schema:
          type: string
        example: '2022-03-20'
      - name: endDate
        in: query
        description: End date of date range
        required: false
        schema:
          type: string
        example: '2022-03-25'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCommerceRefundListResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
        '401':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionBaseResponse'
components:
  schemas:
    BaseAddress:
      type: object
      properties:
        line1:
          type: string
          description: The first line of the address
          example: 10
        line2:
          type: string
          description: The (optional) second line of the address
          example: address line2
        city:
          type: string
          description: Address city
          example: Boston
        stateProvince:
          type: string
          description: 2-Character address state or province
          example: MA
        country:
          type: string
          description: Address country
          example: US
        postalCode:
          type: string
          description: Address zip code
          example: 02119
        postalCodeExtension:
          type: string
          description: Address zip code extension
          example: '0123'
      required:
      - city
      - country
      - line1
      - postalCode
      - stateProvince
    ClientOrgDto:
      type: object
      properties:
        name:
          type: string
          description: The name of the client organization
          example: Health_Plan_ABC_Division
      required:
      - name
    ExceptionBaseResponse:
      type: object
      properties:
        data:
          type: object
          description: 'null'
        exceptions:
          type: array
          items:
            $ref: '#/components/schemas/ResponseException'
    ResponseException:
      type: object
      properties:
        errorCode:
          type: string
          description: The GBL error code that is populated when the exceptionSource is SYSTEM
        exceptionSource:
          type: string
          description: Characterizes the type of exception (JSON, SYSTEM, PARAMETER)
        exceptionMessage:
          type: string
          description: Additional information about the exception
    CommerceOrderDto:
      type: object
      properties:
        orderNumber:
          type: string
          description: A unique order identifier created when an order is placed
          example: ORD00000000004
        status:
          type: string
          description: The status of the order
          example: NEW
        orderDatetime:
          type: string
          format: date-time
          description: The date and time the order was placed
          example: '2024-10-10T10:00:00.000'
        expectedDeliveryDatetime:
          type: string
          format: date-time
          description: The expected delivery date and time of the order
          example: '2024-10-10T10:00:00.000'
        totalAmount:
          type: number
          description: The total cost of the order
          example: 100
        member:
          $ref: '#/components/schemas/MemberDto'
        shipToAddress:
          $ref: '#/components/schemas/BaseAddress'
        memberCommerceOrderLines:
          type: array
          items:
            $ref: '#/components/schemas/CommerceOrderLineDto'
      required:
      - orderNumber
    CommerceOrderLineDto:
      type: object
      properties:
        quantity:
          type: integer
          format: int32
          description: The quantity for this item.
          example: 3
