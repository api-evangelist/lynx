name: Lynx
description: >-
  Lynx (Lynx FinHealth) is a healthcare fintech platform that provides embedded
  banking, payments, benefits, and e-commerce infrastructure for health plans,
  providers, and digital health companies. Its API-first and white-label
  platform powers consumer-directed health accounts (HSA/FSA), ICHRA
  administration, directed and filtered spend accounts, instant physical and
  virtual card issuance with merchant and SKU-level controls, supplemental
  benefits, pharmacy access, rewards and incentive programs, and a qualified
  medical expense (QME) e-commerce marketplace with end-to-end fulfillment. Lynx
  is SOC 2 and HITRUST certified and exposes a developer hub, dated changelog,
  hosted sandbox, and Atlassian status page. Surfaced as a portfolio company of
  Obvious Ventures and enriched from the public Lynx surface (the full API
  reference, authentication model, and test data are gated behind developer
  login).
